name: ci
run-name: CI for ${{ github.sha }} on ${{ github.ref_name }}

on:
  workflow_dispatch:
  push:
    branches:
      - "main"
      - "release-**"
    tags:
      - "v**"
    paths:
      - "rockcraft.yaml"
      - "Makefile"
      - ".trivyignore"
      - ".github/workflows/**.yaml"
  pull_request:
    branches:
      - "*"

jobs:
  unit-test:
    uses: ./.github/workflows/unittest.yaml

  get-architectures:
    runs-on: ubuntu-latest
    outputs:
      architectures: ${{ steps.parse.outputs.architectures }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Parse platforms from rockcraft.yaml
        id: parse
        run: |
          archs=$(yq -o=json -I=0 '.platforms | keys' rockcraft.yaml)
          echo "Found architectures: $archs"
          echo "architectures=$archs" >> "$GITHUB_OUTPUT"

  build:
    needs:
      - unit-test
      - get-architectures
    strategy:
      matrix:
        architecture: ${{ fromJson(needs.get-architectures.outputs.architectures) }}
    uses: canonical/identity-team/.github/workflows/_rock-build.yaml@6e3d618fb7650a26b7a2254a15fef1d28373bd9d # v1.17.1
    with:
      structure-tests-enabled: true
      architecture: ${{ matrix.architecture }}

  gh-publish:
    permissions:
      packages: write
      contents: read
    if: ${{ (github.ref == 'refs/heads/main') || startsWith(github.ref, 'refs/heads/release-') || (github.ref_type == 'tag') }}
    needs: build
    uses: canonical/identity-team/.github/workflows/_rock-gh-publish-third-party.yaml@6e3d618fb7650a26b7a2254a15fef1d28373bd9d # v1.17.1

  oci-publish:
    # only release to oci-factory in case of release
    if: ${{ (github.ref == 'refs/heads/main') || startsWith(github.ref, 'refs/heads/release-') }}
    needs:
      - build
      - scan
    uses: canonical/identity-team/.github/workflows/_rock-oci-publish.yaml@6e3d618fb7650a26b7a2254a15fef1d28373bd9d # v1.17.1
    with:
      edge-release: false
      eol-stable-release: "3 month"
      ubuntu-base-version: "26.04"
      ignore-vulnerabilities: "CVE-2024-42490,CVE-2024-23647"
    secrets:
      PAT_TOKEN: ${{ secrets.PAT_TOKEN }}

  scan:
    permissions:
      packages: read
      contents: read
      security-events: write
      actions: read
    if: ${{ (github.ref == 'refs/heads/main') || startsWith(github.ref, 'refs/heads/release-') || (github.ref_type == 'tag') }}
    needs: gh-publish
    uses: canonical/identity-team/.github/workflows/_rock-scan.yaml@6e3d618fb7650a26b7a2254a15fef1d28373bd9d # v1.17.1
    with:
      image: ${{ needs.gh-publish.outputs.image }}
      exit-code: '1'
      severity: 'HIGH,CRITICAL'
      ignore-unfixed: true
      trivyignores: '.trivyignore'

  oci-update-pr-server:
    permissions:
      contents: write
      pull-requests: write
    needs: [gh-publish, scan]
    if: github.ref_type == 'tag'
    uses: canonical/identity-team/.github/workflows/oci-update-pr.yaml@6e3d618fb7650a26b7a2254a15fef1d28373bd9d # v1.17.1
    with:
        oci-image: ${{ needs.gh-publish.outputs.image }}
        repository: canonical/authentik-server-operator
    secrets:
        PAT_TOKEN: ${{ secrets.PAT_TOKEN }}

  oci-update-pr-worker:
    permissions:
      contents: write
      pull-requests: write
    needs: [gh-publish, scan]
    if: github.ref_type == 'tag'
    uses: canonical/identity-team/.github/workflows/oci-update-pr.yaml@6e3d618fb7650a26b7a2254a15fef1d28373bd9d # v1.17.1
    with:
        oci-image: ${{ needs.gh-publish.outputs.image }}
        repository: canonical/authentik-worker-operator
    secrets:
        PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
