name: auto-approver
run-name: CI for approving PR 

on:
  push:
    branches:
      - "renovate/**"
      # Upstream authentik upgrades (see renovate.json) wait for a person.
      - "!renovate/upstream-**"

jobs:
  autoapprove:
    uses: canonical/identity-team/.github/workflows/pr-auto-approval.yaml@bacce5fe2bd598f8daa69c64438fb872334e2d0a # v1.18.0
    secrets:
      PAT_TOKEN: ${{ secrets.PAT_TOKEN }}