name: auto-approver
run-name: CI for approving PR 

on:
  push:
    branches:
      - "renovate/**"
      # Upstream authentik upgrades (see renovate.json) wait for a person.
      - "!renovate/upstream-**"

jobs:
  autoapprove:
    uses: canonical/identity-team/.github/workflows/pr-auto-approval.yaml@e710e7f451e62c37e7038d45b6c3bfa7dbfb28c0 # v1.20.0
    secrets:
      PAT_TOKEN: ${{ secrets.PAT_TOKEN }}