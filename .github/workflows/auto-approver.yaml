name: auto-approver
run-name: CI for approving PR 

on:
  push:
    branches:
      - "renovate/**"
      # Upstream authentik upgrades (see renovate.json) wait for a person.
      - "!renovate/upstream-**"

jobs:
  autoapprove:
    uses: canonical/identity-team/.github/workflows/pr-auto-approval.yaml@9bbee2e8d44fe72c7e6733d132ea63e844943133 # v1.17.2
    secrets:
      PAT_TOKEN: ${{ secrets.PAT_TOKEN }}