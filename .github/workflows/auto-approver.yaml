name: auto-approver
run-name: CI for approving PR 

on:
  push:
    branches:
      - "renovate/**"
      # Upstream authentik upgrades (see renovate.json) wait for a person.
      - "!renovate/upstream-**"

jobs:
  autoapprove:
    uses: canonical/identity-team/.github/workflows/pr-auto-approval.yaml@6e3d618fb7650a26b7a2254a15fef1d28373bd9d # v1.17.1
    secrets:
      PAT_TOKEN: ${{ secrets.PAT_TOKEN }}