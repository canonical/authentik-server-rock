name: auto-approver
run-name: CI for approving PR 

on:
  push:
    branches:
      - "renovate/**"
      # Upstream authentik upgrades (see renovate.json) wait for a person.
      - "!renovate/upstream-**"

jobs:
  autoapprove:
    uses: canonical/identity-team/.github/workflows/pr-auto-approval.yaml@00995831ff788db43992012900820edf7967305f # v1.19.2
    secrets:
      PAT_TOKEN: ${{ secrets.PAT_TOKEN }}