name: Upstream upgrade
run-name: Upstream upgrade analysis for PR ${{ github.event.pull_request.number }}

# When a pull request changes the upstream version in rockcraft.yaml (Renovate
# opens these), comment with what changed in upstream's build and how risky the
# upgrade is. The same script writes the charm upgrade issues, which are opened
# by hand, see upstream-charm-issues.yaml.

on:
  pull_request:
    paths:
      - "rockcraft.yaml"
      - ".github/upstream-upgrade.yaml"
      - "scripts/**"
      - "templates/**"
      - "tests/**"
      - ".github/workflows/upstream-upgrade.yaml"

concurrency:
  group: upstream-upgrade-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v

  analyse:
    # Pull requests from forks get no secrets and a read-only token.
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.PAT_TOKEN || github.token }}

      - name: Analyse the upgrade
        id: analysis
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_CI_KEY: ${{ secrets.OPENROUTER_CI_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
        run: |
          git fetch --quiet --depth=1 origin "$BASE_SHA"
          git show "$BASE_SHA:rockcraft.yaml" > "$RUNNER_TEMP/base-rockcraft.yaml"
          python3 scripts/upstream_upgrade.py \
            --from-rockcraft "$RUNNER_TEMP/base-rockcraft.yaml" \
            --prune-overrides \
            --out-dir "$RUNNER_TEMP/upgrade"

      - name: Commit pruned dependency overrides
        if: ${{ steps.analysis.outputs.pruned == 'true' }}
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rockcraft.yaml
          git commit -m "chore(deps): remove upstreamed CVE dependency overrides"
          git push origin "HEAD:${HEAD_REF}"

      - name: Comment on the pull request
        if: ${{ steps.analysis.outputs.changed == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          cat "$RUNNER_TEMP/upgrade/pr_comment.md" >> "$GITHUB_STEP_SUMMARY"
          jq -Rs '{body: .}' "$RUNNER_TEMP/upgrade/pr_comment.md" > "$RUNNER_TEMP/comment.json"

          # Keep one comment per pull request and update it on every push.
          comments="repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments"
          existing=$(gh api --paginate "$comments" --jq '
            .[]
            | select(.user.login == "github-actions[bot]")
            | select(.body | startswith("<!-- upstream-upgrade-analysis -->"))
            | .id' | sed -n 1p)
          if [ -n "$existing" ]; then
            gh api --silent --method PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${existing}" \
              --input "$RUNNER_TEMP/comment.json"
          else
            gh api --silent --method POST "$comments" --input "$RUNNER_TEMP/comment.json"
          fi
